name: Automated Release & Deploy

on:
  push:
    branches:
      - main
      - dev
      - flutter-migration
  workflow_dispatch:

jobs:
  release-and-deploy:
    name: Build, Release & Deploy
    if: (github.event_name == 'push' && (contains(github.event.head_commit.message, 'version update') || contains(github.event.head_commit.message, 'Version update') || contains(github.event.head_commit.message, 'release:'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Automated Date Version (CalVer)
        id: generate_version
        run: |
          DATE_VERSION=$(date +'%Y.%m.%d')
          BUILD_NUM=${{ github.run_number }}
          FULL_VERSION="${DATE_VERSION}+${BUILD_NUM}"
          TAG_NAME="v${DATE_VERSION}.${BUILD_NUM}"
          
          # Dynamically inject CalVer version into pubspec.yaml
          sed -i "s/^version: .*/version: $FULL_VERSION/" pubspec.yaml
          
          echo "APP_VERSION=$DATE_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "Automated Version: $FULL_VERSION (Release Tag: $TAG_NAME)"

      - name: Configure Environment
        run: |
          cat << 'EOF' > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          GITHUB_REPO=${{ github.repository }}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY || secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" \
            --dart-define=GITHUB_REPO="${{ github.repository }}"

      - name: Deploy Web to Vercel (Production)
        if: env.VERCEL_TOKEN != ''
        run: |
          npm install --global vercel@latest
          cp web/vercel.json build/web/vercel.json
          cp -r .vercel build/web/ 2>/dev/null || true
          vercel deploy build/web --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "FairShare-${{ env.TAG_NAME }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "FairShare ${{ env.TAG_NAME }}"
          files: "FairShare-${{ env.TAG_NAME }}.apk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
