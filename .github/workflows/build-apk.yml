name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0) to publish directly to GitHub Releases'
        required: false
        default: 'v1.0.0'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Environment Variables
        run: |
          cat << 'EOF' > .env
          SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Android Release APK
        if: ${{ (inputs.build_type || 'release') == 'release' }}
        run: flutter build apk --release

      - name: Build Android Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      - name: Locate Output APK
        id: find_apk
        run: |
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "apk_path=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT
            echo "apk_name=FairShare-Flutter-Release.apk" >> $GITHUB_OUTPUT
          elif [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "apk_path=build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=FairShare-Flutter-Debug.apk" >> $GITHUB_OUTPUT
          else
            APK_FILE=$(find build -name "*.apk" | head -n 1)
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
            echo "apk_name=FairShare-Flutter.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_apk.outputs.apk_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.tag_name != '' && inputs.tag_name != null)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: FairShare Flutter ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
