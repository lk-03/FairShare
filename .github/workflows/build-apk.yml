name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0) to publish directly to GitHub Releases'
        required: false
        default: 'v1.0.0'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Configure Environment Variables
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://axjmjggkqbwnibgkosaw.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_b42lq6WD2QGAFMVQmMgg2A_ZhmR0man' }}
          EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '256502909999-si4tkiianf71fhdgon0f1d2oa79pn688.apps.googleusercontent.com' }}
          EOF

      - name: Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        if: ${{ (inputs.build_type || 'release') == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build Android Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate Output APK
        id: find_apk
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "apk_name=FairShare-Release.apk" >> $GITHUB_OUTPUT
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=FairShare-Debug.apk" >> $GITHUB_OUTPUT
          else
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
            echo "apk_name=FairShare.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_apk.outputs.apk_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.tag_name != '' && inputs.tag_name != null)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: FairShare ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
