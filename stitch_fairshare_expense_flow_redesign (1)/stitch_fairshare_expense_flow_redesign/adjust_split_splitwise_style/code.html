<style>
  @layer base {
    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #191919;
      color: #ffffff;
      font-family: 'Roboto', 'Inter', sans-serif;
    }
    body {
      overscroll-behavior-y: none;
      min-height: 100vh;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  }
  /* Hide scrollbar for tabs */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  
  /* Splitwise custom checkbox */
  .sw-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border: 2px solid #555555;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    position: relative;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease-in-out;
  }
  .sw-checkbox:checked {
    background-color: #1cc29f;
    border-color: #1cc29f;
  }
  .sw-checkbox:checked::after {
    content: '';
    position: absolute;
    width: 6px;
    height: 12px;
    border: solid #191919;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);

</style>

      (4 people)
    </span>
</div>
<!-- "All" Toggle Checkbox on right -->

<script>
  const TOTAL_EXPENSE = 1450.00; // Total matches ~₹362.50/person for 4 people
  let currentTab = 'equally';

  const TAB_CONFIGS = {
    equally: {
      title: "Split equally",
      desc: "Select which people owe an equal share.",
      prefix: "",
      defaultVal: ""
    },
    unequally: {
      title: "Split unequally",
      desc: "Specify exactly how much each person owes.",
      prefix: "₹",
      defaultVal: "0.00"
    },
    percentages: {
      title: "Split by percentages",
      desc: "Enter the percentage split that's right for you.",
      prefix: "%",
      defaultVal: "25"
    },
    shares: {
      title: "Split by shares",
      desc: "Enter the number of shares each person owes.",
      prefix: "shares",
      defaultVal: "1"
    },
    adjustment: {
      title: "Split by adjustment",
      desc: "Enter adjustments to reflect who owes extra; Splitwise will distribute the remainder equally.",
      prefix: "+",
      defaultVal: "0.00"
    }
  };

  function switchTab(tabKey, btnElement) {
    currentTab = tabKey;

    // Update Tab UI
    document.querySelectorAll('.tab-item').forEach(tab => {
      tab.classList.remove('text-white', 'border-white');
      tab.classList.add('text-[#888888]', 'border-transparent');
    });
    btnElement.classList.remove('text-[#888888]', 'border-transparent');
    btnElement.classList.add('text-white', 'border-white');

    // Update Header Text
    const conf = TAB_CONFIGS[tabKey];
    document.getElementById('mode-title').textContent = conf.title;
    document.getElementById('mode-desc').textContent = conf.desc;

    // Toggle controls
    const equallyCtrls = document.querySelectorAll('.ctrl-equally');
    const inputCtrls = document.querySelectorAll('.ctrl-input');
    const memberSubtexts = document.querySelectorAll('.member-subtext');
    const allToggle = document.getElementById('bottom-all-toggle');

    if (tabKey === 'equally') {
      equallyCtrls.forEach(el => el.classList.remove('hidden'));
      inputCtrls.forEach(el => el.classList.add('hidden'));
      memberSubtexts.forEach(el => el.classList.add('hidden'));
      allToggle.classList.remove('hidden');
      allToggle.classList.add('flex');
      calculateEqually();
    } else {
      equallyCtrls.forEach(el => el.classList.add('hidden'));
      inputCtrls.forEach(el => {
        el.classList.remove('hidden');
        el.classList.add('flex');
      });
      allToggle.classList.add('hidden');
      allToggle.classList.remove('flex');

      // Update prefixes and inputs
      document.querySelectorAll('.ctrl-input-prefix').forEach(p => {
        p.textContent = conf.prefix;
      });

      if (tabKey === 'adjustment') {
        memberSubtexts.forEach(el => el.classList.remove('hidden'));
      } else {
        memberSubtexts.forEach(el => el.classList.add('hidden'));
      }

      handleCustomInput();
    }
  }

  function calculateEqually() {
    const checkboxes = document.querySelectorAll('.member-checkbox');
    let selectedCount = 0;
    checkboxes.forEach(cb => { if(cb.checked) selectedCount++; });

    const totalCheckboxes = checkboxes.length;
    const allToggle = document.getElementById('toggle-all-checkbox');
    allToggle.checked = (selectedCount === totalCheckboxes);

    const amountEl = document.getElementById('bottom-summary-amount');
    const countEl = document.getElementById('bottom-summary-count');

    if (selectedCount === 0) {
      amountEl.textContent = "₹0.00/person";
      countEl.textContent = "(0 people)";
      return;
    }

    const perPerson = TOTAL_EXPENSE / selectedCount;
    // Format nicely like Splitwise ~₹362.50/person
    amountEl.textContent = `~₹${perPerson.toFixed(2)}/person`;
    countEl.textContent = `(${selectedCount} ${selectedCount === 1 ? 'person' : 'people'})`;
  }

  function toggleSelectAll(isChecked) {
    const checkboxes = document.querySelectorAll('.member-checkbox');
    checkboxes.forEach(cb => cb.checked = isChecked);
    calculateEqually();
  }

  function handleCustomInput() {
    const amountEl = document.getElementById('bottom-summary-amount');
    const countEl = document.getElementById('bottom-summary-count');

    if (currentTab === 'adjustment') {
      let extraTotal = 0;
      document.querySelectorAll('.member-num-input').forEach(inp => {
        extraTotal += parseFloat(inp.value) || 0;
      });
      const remainder = Math.max(0, TOTAL_EXPENSE - extraTotal);
      const perHead = remainder / 4;

      document.querySelectorAll('.member-item').forEach(item => {
        const inpVal = parseFloat(item.querySelector('.member-num-input').value) || 0;
        const totalShare = perHead + inpVal;
        const sub = item.querySelector('.member-subtext');
        sub.textContent = `₹${totalShare.toFixed(2)}`;
      });

      amountEl.textContent = `₹${extraTotal.toFixed(2)} adjusted`;
      countEl.textContent = `(₹${remainder.toFixed(2)} left to split)`;
    } else if (currentTab === 'percentages') {
      let totalPct = 0;
      document.querySelectorAll('.member-num-input').forEach(inp => {
        totalPct += parseFloat(inp.value) || 0;
      });
      amountEl.textContent = `${totalPct}% of 100%`;
      const diff = 100 - totalPct;
      countEl.textContent = diff === 0 ? "100% split" : `${diff > 0 ? diff + '% left' : Math.abs(diff) + '% over'}`;
    } else if (currentTab === 'unequally') {
      let sum = 0;
      document.querySelectorAll('.member-num-input').forEach(inp => {
        sum += parseFloat(inp.value) || 0;
      });
      amountEl.textContent = `₹${sum.toFixed(2)} of ₹${TOTAL_EXPENSE.toFixed(2)}`;
      const left = TOTAL_EXPENSE - sum;
      countEl.textContent = Math.abs(left) < 0.01 ? "All settled" : (left > 0 ? `₹${left.toFixed(2)} left` : `₹${Math.abs(left).toFixed(2)} over`);
    } else if (currentTab === 'shares') {
      let shares = 0;
      document.querySelectorAll('.member-num-input').forEach(inp => {
        shares += parseInt(inp.value, 10) || 0;
      });
      amountEl.textContent = `${shares} total shares`;
      countEl.textContent = shares > 0 ? `(~₹${(TOTAL_EXPENSE/shares).toFixed(2)}/share)` : "(0 shares)";
    }
  }

  function submitSplitConfirmation() {
    const navRight = event.currentTarget;
    navRight.innerHTML = `<span class="material-symbols-outlined text-[24px] text-[#1cc29f] animate-pulse">check_circle</span>`;
    setTimeout(() => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        alert("Split saved successfully!");
      }
    }, 400);
  }

  // Initialize
  calculateEqually();
</script>
</body></html>
